<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Closer Leaderboard — Jay Sales OS</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --bg-elevated: #141821;
    --bg-card: #1a1f2e;
    --border: #232a3d;
    --text: #e6e9ef;
    --text-dim: #8a93a6;
    --accent: #00d084;
    --accent-dim: #00a36a;
    --danger: #ff4d6d;
    --gold: #ffd700;
    --silver: #c0c0c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px;
    min-height: 100vh;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
  .header-actions { display: flex; gap: 12px; align-items: center; }
  .updated { font-size: 12px; color: var(--text-dim); }
  .refresh-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s;
  }
  .refresh-btn:hover { background: var(--accent-dim); }

  .controls {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .preset-btn {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .preset-btn:hover { border-color: var(--accent); }
  .preset-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .custom-range {
    display: none;
    align-items: center;
    gap: 8px;
    margin-left: 8px;
  }
  .custom-range.visible { display: flex; }
  .custom-range input {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color-scheme: dark;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  @media (min-width: 1100px) {
    .team-grid-6,
    .team-grid-5,
    .team-grid-4 { grid-template-columns: repeat(6, 1fr); }
  }
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .kpi-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .kpi-value {
    font-size: 30px;
    font-weight: 700;
    font-feature-settings: 'tnum';
    letter-spacing: -0.02em;
  }
  .kpi-value.accent { color: var(--accent); }

  .table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead { background: var(--bg-elevated); }
  th, td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th[data-sort]::after { content: ' ⇅'; opacity: 0.3; font-size: 10px; }
  th.sort-asc::after { content: ' ↑'; opacity: 1; color: var(--accent); }
  th.sort-desc::after { content: ' ↓'; opacity: 1; color: var(--accent); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  td { font-size: 14px; font-feature-settings: 'tnum'; }
  td.rep-name { font-weight: 600; font-size: 15px; }
  .medal { margin-right: 6px; }

  .status {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 40px;
    border-radius: 12px;
    font-size: 14px;
    text-align: center;
    color: var(--text-dim);
  }
  .status.error {
    background: rgba(255,77,109,0.08);
    color: var(--danger);
    border-color: rgba(255,77,109,0.3);
  }

  .footnote {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-panel.hidden { display: none; }

  .monthly-controls {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .control-group select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
    cursor: pointer;
  }
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .chart-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 14px;
  }
  .chart-title {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .chart-card canvas {
    width: 100% !important;
    height: 260px !important;
  }
  .chart-def {
    opacity: 0.6;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    margin-left: 6px;
  }
  .chart-note {
    font-size: 11px;
    color: #ffb020;
    margin-bottom: 10px;
    padding: 6px 10px;
    background: rgba(255,176,32,0.08);
    border: 1px solid rgba(255,176,32,0.2);
    border-radius: 6px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Closer Leaderboard</h1>
      <div class="subtitle" id="subtitle">Loading…</div>
    </div>
    <div class="header-actions">
      <span class="updated" id="updated"></span>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="closers">Closers</button>
    <button class="tab-btn" data-tab="weekly">Weekly</button>
    <button class="tab-btn" data-tab="monthly">Monthly</button>
  </div>

  <div class="tab-panel" data-panel="overview">
    <div class="controls">
      <button class="preset-btn active" data-preset="mtd">MTD</button>
      <button class="preset-btn" data-preset="last-month">Last Month</button>
      <button class="preset-btn" data-preset="last-7">Last 7 Days</button>
      <button class="preset-btn" data-preset="last-30">Last 30 Days</button>
      <button class="preset-btn" data-preset="ytd">YTD</button>
      <button class="preset-btn" data-preset="custom">Custom</button>
      <div class="custom-range" id="customRange">
        <input type="date" id="startDate">
        <span style="color:var(--text-dim)">→</span>
        <input type="date" id="endDate">
      </div>
    </div>

    <div id="content">
      <div class="status">Loading sales data…</div>
    </div>
  </div>

  <div class="tab-panel hidden" data-panel="closers">
    <div id="closersContent">
      <div class="status">Loading closer pipeline…</div>
    </div>
  </div>

  <div class="tab-panel hidden" data-panel="weekly">
    <div id="weeklyContent">
      <div class="status">Loading weekly data…</div>
    </div>
  </div>

  <div class="tab-panel hidden" data-panel="monthly">
    <div class="monthly-controls">
      <label class="control-group">
        <span>Rep</span>
        <select id="monthlyRep"><option value="__team__">Team Total</option></select>
      </label>
      <label class="control-group">
        <span>From</span>
        <select id="monthlyFrom"></select>
      </label>
      <label class="control-group">
        <span>To</span>
        <select id="monthlyTo"></select>
      </label>
    </div>
    <div id="monthlyContent">
      <div class="status">Loading monthly data…</div>
    </div>
  </div>

  <div class="footnote">Live data from Airtable · Jay Sales OS · All reps</div>
</div>

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;

function fmtDateDisplay(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtCurrency(n) {
  return '$' + Math.round(n || 0).toLocaleString();
}
function fmtPct(n) {
  if (!isFinite(n) || isNaN(n)) return '—';
  return (n * 100).toFixed(1) + '%';
}

function getMTDRange() {
  const now = new Date();
  return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: now };
}
function getLastMonthRange() {
  const now = new Date();
  return {

    end: new Date(now.getFullYear(), now.getMonth(), 0)
  };
}
function getLastNDaysRange(n) {
  const end = new Date();

  start.setDate(start.getDate() - n + 1);
  return { start, end };
}
function getYTDRange() {
  const now = new Date();
  return { start: new Date(now.getFullYear(), 0, 1), end: now };
}

async function fetchAllRecords() {
  const records = [];
  let offset;
  do {
    const params = new URLSearchParams();
    if (offset) params.set('offset', offset);
    const res = await fetch(`/api/airtable?${params}`);
    if (!res.ok) {
      const body = await res.text();
      throw new Error(`API ${res.status}: ${body.slice(0,150)}`);
    }
    const data = await res.json();
    records.push(...data.records);
    offset = data.offset;
  } while (offset);
  return records;
}

  const byRep = {};
  for (const rec of filtered) {
    const f = rec.fields;
    const rep = repName(f[FIELDS.rep]);
    if (!byRep[rep]) byRep[rep] = blankTotals(rep);
    const b = byRep[rep];
    b.slotsOpen += f[FIELDS.slotsOpen] || 0;
    b.scheduled += f[FIELDS.scheduled] || 0;
    b.live += f[FIELDS.live] || 0;
    b.offersMade += f[FIELDS.offersMade] || 0;
    b.units += f[FIELDS.units] || 0;
    b.contract += f[FIELDS.contract] || 0;
    b.cash += f[FIELDS.cash] || 0;
    b.dials += f[FIELDS.dials] || 0;
    b.pickups += f[FIELDS.pickups] || 0;
    b.phoneSets += f[FIELDS.phoneSets] || 0;
    b.dmSets += f[FIELDS.dmSets] || 0;
  }
  for (const rep in byRep) {
    const b = byRep[rep];
    b.fillRate = b.slotsOpen ? b.scheduled / b.slotsOpen : 0;
    b.showRate = b.scheduled ? b.live / b.scheduled : 0;
    b.closeRate = b.live ? b.units / b.live : 0;
    b.revPerCall = b.scheduled ? b.contract / b.scheduled : 0;
    b.pickupRate = b.dials ? b.pickups / b.dials : 0;
  }

  const team = blankTotals('Team');
  for (const rep in byRep) {
    const b = byRep[rep];
    team.slotsOpen += b.slotsOpen;
    team.scheduled += b.scheduled;
    team.live += b.live;
    team.offersMade += b.offersMade;
    team.units += b.units;
    team.contract += b.contract;
    team.cash += b.cash;
    team.dials += b.dials;
    team.pickups += b.pickups;
    team.phoneSets += b.phoneSets;
    team.dmSets += b.dmSets;
  }
  team.fillRate = team.slotsOpen ? team.scheduled / team.slotsOpen : 0;
  team.showRate = team.scheduled ? team.live / team.scheduled : 0;
  team.closeRate = team.live ? team.units / team.live : 0;

  // Team-level financial metrics from Sales Tracking sheet (director's source of truth)
  team.totalCashCollected = 0;
  team.newCashCollected = 0;
  team.sheetContract = 0;
  team.sheetUnits = 0;
  for (const row of SALES_TRACKING) {
    if (row.d >= startStr && row.d <= endStr) {
      team.totalCashCollected += row.c;
      if (!row.pp) {
        team.newCashCollected += row.c;
        team.sheetContract += (row.k || 0);
        team.sheetUnits += (row.u || 0);
      }
    }
  }
  // Contract Value stays Airtable-sourced (rep-entered SGR rollup is current truth).
  team.units = team.sheetUnits;
  team.revPerCall = team.scheduled ? team.contract / team.scheduled : 0;
  team.pickupRate = team.dials ? team.pickups / team.dials : 0;

  return { reps: Object.values(byRep), team, rowCount: filtered.length };
}

function mondayOf(d) {
  const out = new Date(d);
  const day = out.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  out.setDate(out.getDate() + diff);
  out.setHours(0, 0, 0, 0);
  return out;
}

function getAllWeeks() {
  let earliest = null;
  for (const r of allRecords) {
    const date = r.fields[FIELDS.date];
    const rep = repName(r.fields[FIELDS.rep]);
    if (!date || !rep) continue;
    if (!earliest || date < earliest) earliest = date;
  }
  if (!earliest) return [];

  const earliestDate = new Date(earliest + 'T00:00:00');
  const firstMonday = mondayOf(earliestDate);
  const thisMonday = mondayOf(new Date());
  const weeks = [];
  const cursor = new Date(firstMonday);
  while (cursor <= thisMonday) {
    const start = new Date(cursor);
    const end = new Date(cursor);
    end.setDate(end.getDate() + 6);
    end.setHours(23, 59, 59, 999);
    weeks.push({ start, end });
    cursor.setDate(cursor.getDate() + 7);
  }
  return weeks.reverse();
}

function fmtWeekLabel(start, end) {
  const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
  const s = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const e = sameMonth
    ? end.toLocaleDateString('en-US', { day: 'numeric' })
    : end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return `${s} – ${e}, ${end.getFullYear()}`;
}

function getAllMonthKeys() {
  const keys = new Set();
  for (const r of allRecords) {
    const date = r.fields[FIELDS.date];

    if (date && rep) keys.add(date.slice(0, 7));
  }
  return Array.from(keys).sort();
}

function fmtMonth(key) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('en-US', { month: 'short', year: 'numeric' });
}

// Hardcoded override for October 2025 — Airtable EOD reporting was incomplete that month.
// Sourced from the Sales Tracking + Call Tracking Google Sheets. ONLY applied when monthKey === '2025-10'.
const OCTOBER_OVERRIDES = {
  // "cash" = NEW cash only (excludes rows where col M is "PAYMENT PLAN" — those are recurring installments)
  // "units" = NEW sales only (same exclusion)
  team:           { contract: 162601.20, cash: 114502.00, scheduled: 195, units: 47 },
  'Tyler Hoff':   { contract: 76556.30,  cash: 48915.30,  scheduled: 97,  units: 26 },

  'Daniel Hussain': { contract: 0,       cash: 2192.40,   scheduled: 16,  units: 5 }
};

function aggregateMonth(monthKey, repFilter) {
  const [y, m] = monthKey.split('-').map(Number);
  const start = new Date(y, m - 1, 1);
  const end = new Date(y, m, 0, 23, 59, 59);
  const { reps, team } = filterAndAggregate({ start, end });
  const base = repFilter === '__team__'
    ? team
    : (reps.find(r => r.rep === repFilter) || blankTotals(repFilter));

  if (monthKey === '2025-10') {
    const ov = repFilter === '__team__' ? OCTOBER_OVERRIDES.team : OCTOBER_OVERRIDES[repFilter];
    if (ov) {
      const result = { ...base, ...ov };
      result.revPerCall = result.scheduled ? result.contract / result.scheduled : 0;
      // Assumed rates for October — Live Calls couldn't be reconciled, so use baseline assumption
      result.showRate = 0.70;
      result.closeRate = 0.30;
      return result;
    }
  }
  return base;
}

function renderMonthly() {
  if (!allRecords.length) return;
  const repFilter = document.getElementById('monthlyRep').value;
  const fromKey = document.getElementById('monthlyFrom').value;
  const toKey = document.getElementById('monthlyTo').value;
  const allMonths = getAllMonthKeys();
  const monthsInRange = allMonths.filter(k => k >= fromKey && k <= toKey);

  if (!monthsInRange.length) {
    document.getElementById('monthlyContent').innerHTML = '<div class="status">No months in range</div>';
    return;
  }

  const monthData = monthsInRange.map(k => ({
    label: fmtMonth(k),
    totals: aggregateMonth(k, repFilter)
  }));

  const cardsHtml = MONTHLY_METRICS.map(m => `
    <div class="chart-card">
      <div class="chart-title">${m.label}${m.def ? ` <span class="chart-def">${m.def}</span>` : ''}</div>
      <canvas id="chart-${m.key}"></canvas>
    </div>
  `).join('');
  document.getElementById('monthlyContent').innerHTML = `<div class="charts-grid">${cardsHtml}</div>`;

  if (window.ChartDataLabels && !Chart.registry.plugins.get('datalabels')) {
    Chart.register(window.ChartDataLabels);
  }

  for (const m of MONTHLY_METRICS) {
    const ctx = document.getElementById(`chart-${m.key}`).getContext('2d');
    if (monthlyCharts[m.key]) monthlyCharts[m.key].destroy();
    const labels = monthData.map(md => md.label);
    const data = monthData.map(md => md.totals[m.key] || 0);
    const fmtVal = (v) => {
      if (m.fmt === 'currency') {
        if (v >= 1000) return '$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k';
        return '$' + Math.round(v).toLocaleString();
      }
      if (m.fmt === 'pct') return (v * 100).toFixed(1) + '%';
      return v.toLocaleString();
    };
    monthlyCharts[m.key] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data,
          backgroundColor: `rgba(${m.color},0.55)`,
          borderColor: `rgba(${m.color},1)`,
          borderWidth: 1,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 24 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (c) => fmtVal(c.parsed.y)
            }
          },
          datalabels: {
            anchor: 'end',
            align: 'top',
            offset: 4,
            color: '#e6e9ef',
            font: { weight: '600', size: 11 },
            formatter: (v) => v ? fmtVal(v) : ''
          }
        },
        scales: {
          x: { ticks: { color: '#8a93a6' }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: {
            beginAtZero: true,
            ticks: {
              color: '#8a93a6',
              callback: (v) => {
                if (m.fmt === 'currency') return '$' + (v >= 1000 ? (v/1000).toFixed(0) + 'k' : v);
                if (m.fmt === 'pct') return (v * 100).toFixed(0) + '%';
                return v;
              }
            },
            grid: { color: 'rgba(255,255,255,0.04)' }
          }
        }
      }
    });
  }
}

function applyPreset(preset) {
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.preset === preset);
  });
  document.getElementById('customRange').classList.toggle('visible', preset === 'custom');

  switch (preset) {
    case 'mtd': currentRange = getMTDRange(); break;
    case 'last-month': currentRange = getLastMonthRange(); break;
    case 'last-7': currentRange = getLastNDaysRange(7); break;
    case 'last-30': currentRange = getLastNDaysRange(30); break;
    case 'ytd': currentRange = getYTDRange(); break;
    case 'custom': {
      const s = document.getElementById('startDate').value;
      const e = document.getElementById('endDate').value;
      if (s && e) currentRange = {
        start: new Date(s + 'T00:00:00'),
        end: new Date(e + 'T23:59:59')
      };
      break;
    }
  }
  if (allRecords.length) render();
}

});

// ===== Closers (GHL pipeline) =====
let closersLoaded = false;

async function loadClosers() {
  closersLoaded = true;
  const root = document.getElementById('closersContent');
  root.innerHTML = '<div class="status">Loading closer pipeline from GHL…</div>';
  try {
    const r = await fetch('/api/ghl');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    renderClosers(data);
  } catch (e) {
    root.innerHTML = `<div class="status error">Failed to load GHL data: ${e.message}</div>`;
    closersLoaded = false; // allow retry
  }
}

function renderClosers(data) {
  const root = document.getElementById('closersContent');
  const closers = data.closers || [];
  const totals = data.totals || { upcoming: 0, done: 0, cancelled: 0 };
  const weekStart = new Date(data.weekStart);
  const weekEnd = new Date(data.weekEnd);
  weekEnd.setDate(weekEnd.getDate() - 1); // display as Sunday
  const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  const kpis = `
    <div class="section-title">📅 Closer Pipeline · Week of ${fmt(weekStart)} – ${fmt(weekEnd)}</div>
    <div class="grid">
      <div class="kpi-card">
        <div class="kpi-label">Calls Left This Week</div>
        <div class="kpi-value accent">${totals.upcoming}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Calls Done</div>
        <div class="kpi-value">${totals.done}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Cancelled</div>
        <div class="kpi-value">${totals.cancelled}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Active Closers</div>
        <div class="kpi-value">${closers.length}</div>
      </div>
    </div>
  `;

  let tableHtml;
  if (!closers.length) {
    tableHtml = '<div class="status">No bookings on the sales calendars this week.</div>';
  } else {
    const rows = closers.map(c => `
      <tr>
        <td class="rep-name">${c.name}</td>
        <td style="font-weight:700;color:var(--accent);font-size:18px">${c.upcoming}</td>
        <td>${c.done}</td>
        <td>${c.cancelled}</td>
        <td>${c.upcoming + c.done + c.cancelled}</td>
      </tr>
    `).join('');
    tableHtml = `
      <div class="section-title">By Closer</div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Closer</th>
          <th>Calls Left</th>
          <th>Done</th>
          <th>Cancelled</th>
          <th>Total Booked</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    `;
  }

  const updated = new Date(data.updatedAt).toLocaleString();
  const calList = (data.calendarsQueried || []).join(' · ');
  const errors = (data.perCalendarErrors || []);
  const errHtml = errors.length
    ? `<div class="footnote" style="color:var(--danger)">⚠ ${errors.length} calendar(s) errored: ${errors.map(e=>e.calendar).join(', ')}</div>`
    : '';

  root.innerHTML = kpis + tableHtml + `
    <div class="footnote">Live data from GHL · Updated ${updated}<br>Calendars: ${calList}</div>
    ${errHtml}
  `;
}

const init = getMTDRange();
document.getElementById('startDate').value = fmtDate(init.start);
document.getElementById('endDate').value = fmtDate(init.end);

loadData();
</script>
</body>
</html>
