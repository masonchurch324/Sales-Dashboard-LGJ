<style>
  :root {
    --bg: #0b0e14;
    --bg-elevated: #141821;
    --bg-card: #1a1f2e;
    --border: #232a3d;
    --text: #e6e9ef;
    --text-dim: #8a93a6;
    --accent: #00d084;
    --accent-dim: #00a36a;
    --danger: #ff4d6d;
    --gold: #ffd700;
    --silver: #c0c0c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px;
    min-height: 100vh;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
  .header-actions { display: flex; gap: 12px; align-items: center; }
  .updated { font-size: 12px; color: var(--text-dim); }
  .refresh-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s;
  }
  .refresh-btn:hover { background: var(--accent-dim); }

  .controls {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .preset-btn {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .preset-btn:hover { border-color: var(--accent); }
  .preset-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .custom-range {
    display: none;
    align-items: center;
    gap: 8px;
    margin-left: 8px;
  }
  .custom-range.visible { display: flex; }
  .custom-range input {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color-scheme: dark;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  @media (min-width: 1100px) {
    .team-grid-6,
    .team-grid-5,
    .team-grid-4 { grid-template-columns: repeat(6, 1fr); }
  }
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .kpi-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .kpi-value {
    font-size: 30px;
    font-weight: 700;
    font-feature-settings: 'tnum';
    letter-spacing: -0.02em;
  }
  .kpi-value.accent { color: var(--accent); }

  .table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead { background: var(--bg-elevated); }
  th, td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th[data-sort]::after { content: ' ⇅'; opacity: 0.3; font-size: 10px; }
  th.sort-asc::after { content: ' ↑'; opacity: 1; color: var(--accent); }
  th.sort-desc::after { content: ' ↓'; opacity: 1; color: var(--accent); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  td { font-size: 14px; font-feature-settings: 'tnum'; }
  td.rep-name { font-weight: 600; font-size: 15px; }
  .medal { margin-right: 6px; }

  .status {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 40px;
    border-radius: 12px;
    font-size: 14px;
    text-align: center;
    color: var(--text-dim);
  }
  .status.error {
    background: rgba(255,77,109,0.08);
    color: var(--danger);
    border-color: rgba(255,77,109,0.3);
  }

  .footnote {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-panel.hidden { display: none; }

  .monthly-controls {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .control-group select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
    cursor: pointer;
  }
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .chart-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 14px;
  }
  .chart-title {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .chart-card canvas {
    width: 100% !important;
    height: 260px !important;
  }
  .chart-def {
    opacity: 0.6;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    margin-left: 6px;
  }
  .chart-note {
    font-size: 11px;
    color: #ffb020;
    margin-bottom: 10px;
    padding: 6px 10px;
    background: rgba(255,176,32,0.08);
    border: 1px solid rgba(255,176,32,0.2);
    border-radius: 6px;
  }
</style>
</head>

let allRecords = [];
let currentRange = getMTDRange();
let sortKey = 'contract';
let sortDir = 'desc';

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtDateDisplay(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtCurrency(n) {
  return '$' + Math.round(n || 0).toLocaleString();
}
function fmtPct(n) {
  if (!isFinite(n) || isNaN(n)) return '—';
  return (n * 100).toFixed(1) + '%';
}

function getMTDRange() {
  const now = new Date();
  return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: now };
}
function getLastMonthRange() {
  const now = new Date();
  return {
    start: new Date(now.getFullYear(), now.getMonth() - 1, 1),
    end: new Date(now.getFullYear(), now.getMonth(), 0)
  };
}
function getLastNDaysRange(n) {
  const end = new Date();
  const start = new Date();
  start.setDate(start.getDate() - n + 1);
  return { start, end };
}
function getYTDRange() {
  const now = new Date();
  return { start: new Date(now.getFullYear(), 0, 1), end: now };
}

async function fetchAllRecords() {
  const records = [];
  let offset;
  do {
    const params = new URLSearchParams();
    if (offset) params.set('offset', offset);
    const res = await fetch(`/api/airtable?${params}`);
    if (!res.ok) {
      const body = await res.text();
      throw new Error(`API ${res.status}: ${body.slice(0,150)}`);
    }
    const data = await res.json();
    records.push(...data.records);
    offset = data.offset;
  } while (offset);
  return records;
}

function repName(val) {
  if (!val) return null;
  return typeof val === 'string' ? val : val.name;
}

function blankTotals(label) {
  return { rep: label, slotsOpen: 0, scheduled: 0, live: 0, offersMade: 0, units: 0, contract: 0, cash: 0, dials: 0, pickups: 0, phoneSets: 0, dmSets: 0 };
}

function filterAndAggregate(range) {
  const r = range || currentRange;
  const startStr = fmtDate(r.start);
  const endStr = fmtDate(r.end);

  const filtered = allRecords.filter(rec => {
    const f = rec.fields;
    const date = f[FIELDS.date];
    const rep = repName(f[FIELDS.rep]);
    if (!date || !rep) return false;
    return date >= startStr && date <= endStr;
  });

  const byRep = {};
  for (const rec of filtered) {
    const f = rec.fields;
    const rep = repName(f[FIELDS.rep]);
    if (!byRep[rep]) byRep[rep] = blankTotals(rep);
    const b = byRep[rep];
    b.slotsOpen += f[FIELDS.slotsOpen] || 0;
    b.scheduled += f[FIELDS.scheduled] || 0;
    b.live += f[FIELDS.live] || 0;
    b.offersMade += f[FIELDS.offersMade] || 0;
    b.units += f[FIELDS.units] || 0;
    b.contract += f[FIELDS.contract] || 0;
    b.cash += f[FIELDS.cash] || 0;
    b.dials += f[FIELDS.dials] || 0;
    b.pickups += f[FIELDS.pickups] || 0;
    b.phoneSets += f[FIELDS.phoneSets] || 0;
    b.dmSets += f[FIELDS.dmSets] || 0;
  }
  for (const rep in byRep) {
    const b = byRep[rep];
    b.fillRate = b.slotsOpen ? b.scheduled / b.slotsOpen : 0;
    b.showRate = b.scheduled ? b.live / b.scheduled : 0;
    b.closeRate = b.live ? b.units / b.live : 0;
    b.revPerCall = b.scheduled ? b.contract / b.scheduled : 0;
    b.pickupRate = b.dials ? b.pickups / b.dials : 0;
  }

  const team = blankTotals('Team');
  for (const rep in byRep) {
    const b = byRep[rep];
    team.slotsOpen += b.slotsOpen;
    team.scheduled += b.scheduled;
    team.live += b.live;
    team.offersMade += b.offersMade;
    team.units += b.units;
    team.contract += b.contract;
    team.cash += b.cash;
    team.dials += b.dials;
    team.pickups += b.pickups;
    team.phoneSets += b.phoneSets;
    team.dmSets += b.dmSets;
  }
  team.fillRate = team.slotsOpen ? team.scheduled / team.slotsOpen : 0;
  team.showRate = team.scheduled ? team.live / team.scheduled : 0;
  team.closeRate = team.live ? team.units / team.live : 0;

  // Team-level financial metrics from Sales Tracking sheet (director's source of truth)
  team.totalCashCollected = 0;
  team.newCashCollected = 0;
  team.sheetContract = 0;
  team.sheetUnits = 0;
  for (const row of SALES_TRACKING) {
    if (row.d >= startStr && row.d <= endStr) {
      team.totalCashCollected += row.c;
      if (!row.pp) {
        team.newCashCollected += row.c;
        team.sheetContract += (row.k || 0);
        team.sheetUnits += (row.u || 0);
      }
    }
  }
  // Contract Value stays Airtable-sourced (rep-entered SGR rollup is current truth).
  team.units = team.sheetUnits;
  team.revPerCall = team.scheduled ? team.contract / team.scheduled : 0;
  team.pickupRate = team.dials ? team.pickups / team.dials : 0;

  return { reps: Object.values(byRep), team, rowCount: filtered.length };
}

function mondayOf(d) {
  const out = new Date(d);
  const day = out.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  out.setDate(out.getDate() + diff);
  out.setHours(0, 0, 0, 0);
  return out;
}

function getAllWeeks() {
  let earliest = null;
  for (const r of allRecords) {
    const date = r.fields[FIELDS.date];
    const rep = repName(r.fields[FIELDS.rep]);
    if (!date || !rep) continue;
    if (!earliest || date < earliest) earliest = date;
  }
  if (!earliest) return [];

  const earliestDate = new Date(earliest + 'T00:00:00');
  const firstMonday = mondayOf(earliestDate);
  const thisMonday = mondayOf(new Date());
  const weeks = [];
  const cursor = new Date(firstMonday);
  while (cursor <= thisMonday) {
    const start = new Date(cursor);
    const end = new Date(cursor);
    end.setDate(end.getDate() + 6);
    end.setHours(23, 59, 59, 999);
    weeks.push({ start, end });
    cursor.setDate(cursor.getDate() + 7);
  }
  return weeks.reverse();
}

function fmtWeekLabel(start, end) {
  const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
  const s = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const e = sameMonth
    ? end.toLocaleDateString('en-US', { day: 'numeric' })
    : end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return `${s} – ${e}, ${end.getFullYear()}`;
}

function aggregateMonth(monthKey, repFilter) {
  const [y, m] = monthKey.split('-').map(Number);
  const start = new Date(y, m - 1, 1);
  const end = new Date(y, m, 0, 23, 59, 59);
  const { reps, team } = filterAndAggregate({ start, end });
  const base = repFilter === '__team__'
    ? team
    : (reps.find(r => r.rep === repFilter) || blankTotals(repFilter));

  if (monthKey === '2025-10') {
    const ov = repFilter === '__team__' ? OCTOBER_OVERRIDES.team : OCTOBER_OVERRIDES[repFilter];
    if (ov) {
      const result = { ...base, ...ov };
      result.revPerCall = result.scheduled ? result.contract / result.scheduled : 0;
      // Assumed rates for October — Live Calls couldn't be reconciled, so use baseline assumption
      result.showRate = 0.70;
      result.closeRate = 0.30;
      return result;
    }
  }
  return base;
}

// ===== Compliance Tab =====
let complianceLoaded = false;
let complianceRangeDays = 30;

function renderCompliance() {
  complianceLoaded = true;
  const root = document.getElementById('complianceContent');

  if (typeof APPOINTMENTS === 'undefined' || !APPOINTMENTS.length) {
    root.innerHTML = '<div class="status">No appointments data available. Run the daily refresh to populate.</div>';
    return;
  }

  const now = new Date();
  const cutoff = new Date(now.getTime() - complianceRangeDays * 86400000);

  // Filter to date range, exclude cancelled
  const appts = APPOINTMENTS.filter(a => {
    if (!a.d) return false;
    const ad = new Date(a.d);
    if (isNaN(ad)) return false;
    if (ad < cutoff || ad > now) return false;
    if (a.st === 'cancelled') return false;
    return true;
  });

  // Find the matching Call Tracking row for an appointment (by email, closest call date within ±36hr).
  // Returns the row only if the post-call form was filled (f=true). Otherwise returns null
  // (which means: either no row exists, or row exists but form wasn't filled — both = not compliant).
  function findFormMatch(appt) {
    if (!appt.e) return null;
    if (typeof CALL_TRACKING === 'undefined') return null;
    const apptMs = new Date(appt.d).getTime();
    let best = null, bestDiff = Infinity;
    for (const r of CALL_TRACKING) {
      if (!r.e || r.e !== appt.e) continue;
      const diff = Math.abs(new Date(r.dc).getTime() - apptMs);
      if (diff < 36 * 3600000 && diff < bestDiff) {
        best = r;
        bestDiff = diff;
      }
    }
    return best && best.f ? best : null;
  }

  const perCloser = {};
  const overdueList = [];
  let teamCalls = 0, teamForms = 0, teamOverdue = 0, teamPending = 0;

  for (const a of appts) {
    const closer = a.sp || '(unassigned)';
    if (!perCloser[closer]) perCloser[closer] = { calls: 0, forms: 0, overdue: 0, pending: 0 };
    perCloser[closer].calls++; teamCalls++;

    const apptDate = new Date(a.d);
    const isPast = apptDate < now;
    const form = findFormMatch(a);

    if (form) {
      perCloser[closer].forms++; teamForms++;
    } else if (isPast) {
      const hoursOld = (now - apptDate) / 3600000;
      if (hoursOld >= 48) {
        perCloser[closer].overdue++; teamOverdue++;
        overdueList.push({ ...a, hoursOld: Math.round(hoursOld) });
      } else {
        perCloser[closer].pending++; teamPending++;
      }
    } else {
      // future call — neither overdue nor pending counted toward compliance denominator yet
      perCloser[closer].pending++; teamPending++;
    }
  }

  overdueList.sort((a, b) => b.hoursOld - a.hoursOld);

  const fmtCloser = sp => {
    if (!sp || sp === '(unassigned)') return '(unassigned)';
    return sp.charAt(0).toUpperCase() + sp.slice(1);
  };
  const fmtPctSafe = (n, d) => d > 0 ? (n / d * 100).toFixed(1) + '%' : '—';
  const fmtHours = h => {
    if (h < 24) return h + 'h';
    const days = Math.floor(h / 24);
    const rem = h % 24;
    return rem ? `${days}d ${rem}h` : `${days}d`;
  };
  const fmtDateTime = isoStr => {
    const d = new Date(isoStr);
    return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  };

  // Date range buttons
  const ranges = [{label:'Last 7d',days:7},{label:'Last 14d',days:14},{label:'Last 30d',days:30},{label:'Last 60d',days:60}];
  const rangeBtns = ranges.map(r =>
    `<button class="preset-btn ${r.days === complianceRangeDays ? 'active' : ''}" onclick="complianceRangeDays=${r.days}; renderCompliance();">${r.label}</button>`
  ).join('');

  const teamCompliance = teamCalls - teamPending > 0 ? (teamForms / (teamCalls - teamPending) * 100).toFixed(1) : '—';

  const teamHtml = `
    <div class="controls">${rangeBtns}</div>
    <div class="grid">
      <div class="kpi-card">
        <div class="kpi-label">Calls Held (last ${complianceRangeDays}d)</div>
        <div class="kpi-value">${teamCalls - teamPending}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Forms Submitted</div>
        <div class="kpi-value accent">${teamForms}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Team Compliance</div>
        <div class="kpi-value accent">${teamCompliance}${typeof teamCompliance === 'string' && teamCompliance.endsWith('%') ? '' : '%'}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Overdue (>48hr)</div>
        <div class="kpi-value" style="color:${teamOverdue > 0 ? 'var(--danger)' : 'var(--text)'}">${teamOverdue}</div>
      </div>
    </div>
  `;

  // Per-closer table — only show closers with calls
  const closerRows = Object.entries(perCloser)
    .filter(([_, d]) => d.calls > 0)
    .sort((a, b) => b[1].calls - a[1].calls)
    .map(([closer, d]) => {
      const denom = d.calls - d.pending;
      const pct = denom > 0 ? (d.forms / denom * 100) : null;
      const pctStr = pct === null ? '—' : pct.toFixed(1) + '%';
      const pctColor = pct === null ? '' : (pct >= 90 ? 'var(--accent)' : pct >= 75 ? 'var(--gold)' : 'var(--danger)');
      return `
        <tr>
          <td class="rep-name">${fmtCloser(closer)}</td>
          <td>${d.calls}</td>
          <td>${denom}</td>
          <td>${d.forms}</td>
          <td style="font-weight:700;color:${pctColor}">${pctStr}</td>
          <td style="color:${d.overdue > 0 ? 'var(--danger)' : 'var(--text-dim)'}">${d.overdue}</td>
          <td style="color:var(--text-dim)">${d.pending}</td>
        </tr>
      `;
    }).join('');

  const tableHtml = `
    <div class="section-title">Per Closer</div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Closer</th>
        <th>Total Booked</th>
        <th>Calls Held</th>
        <th>Forms Submitted</th>
        <th>Compliance %</th>
        <th>Overdue (>48hr)</th>
        <th>Pending (<48hr or future)</th>
      </tr></thead>
      <tbody>${closerRows || '<tr><td colspan="7" style="text-align:center;color:var(--text-dim)">No data in this window</td></tr>'}</tbody>
    </table></div>
  `;

  // Overdue list
  const overdueRows = overdueList.slice(0, 100).map(a => `
    <tr>
      <td>${fmtDateTime(a.d)}</td>
      <td class="rep-name">${fmtCloser(a.sp)}</td>
      <td style="font-family:monospace;font-size:13px">${a.e || '(no email)'}</td>
      <td style="color:var(--text-dim);font-size:13px">${a.c || ''}</td>
      <td style="color:var(--danger);font-weight:700">${fmtHours(a.hoursOld)}</td>
    </tr>
  `).join('');

  const overdueHtml = `
    <div class="section-title" style="margin-top:32px">Overdue Forms (${overdueList.length})</div>
    ${overdueList.length === 0
      ? '<div class="status" style="color:var(--accent)">✓ No overdue forms — all calls in this window have a corresponding post-call form within 48 hours.</div>'
      : `<div class="table-wrap"><table>
          <thead><tr>
            <th>Call Time</th>
            <th>Closer</th>
            <th>Contact Email</th>
            <th>Calendar</th>
            <th>Overdue By</th>
          </tr></thead>
          <tbody>${overdueRows}</tbody>
        </table></div>`
    }
  `;

  // Footnote
  const lastDate = APPOINTMENTS.length ? APPOINTMENTS[APPOINTMENTS.length - 1].d.slice(0, 10) : '';
  const footHtml = `
    <div class="footnote">
      <strong>Source of truth:</strong> Forms = Sales Call Tracking 2025 (Call Tracking tab — post-call form populates Lead Interest / Notes columns) · Calls = GHL appointments across 10 sales calendars · Match by client email + call time within ±36hr.<br>
      Pending = held <48hr ago (form not yet due) or future-dated. Compliance % uses calls held >48hr ago as denominator. Snapshot through ${lastDate}.
    </div>
  `;

  root.innerHTML = teamHtml + tableHtml + overdueHtml + footHtml;
}

const init = getMTDRange();
document.getElementById('startDate').value = fmtDate(init.start);
document.getElementById('endDate').value = fmtDate(init.end);

loadData();
</script>
</body>
</html>
