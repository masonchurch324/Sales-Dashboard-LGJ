<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales OS — Jay</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
  :root {
    --bg: #0b0e14;
    --bg-elevated: #141821;
    --bg-card: #1a1f2e;
    --border: #232a3d;
    --text: #e6e9ef;
    --text-dim: #8a93a6;
    --accent: #00d084;
    --accent-dim: #00a36a;
    --danger: #ff4d6d;
    --gold: #ffd700;
    --silver: #c0c0c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px;
    min-height: 100vh;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
  .header-actions { display: flex; gap: 12px; align-items: center; }
  .updated { font-size: 12px; color: var(--text-dim); }
  .refresh-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s;
  }
  .refresh-btn:hover { background: var(--accent-dim); }

  .controls {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .preset-btn {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .preset-btn:hover { border-color: var(--accent); }
  .preset-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .custom-range {
    display: none;
    align-items: center;
    gap: 8px;
    margin-left: 8px;
  }
  .custom-range.visible { display: flex; }
  .custom-range input {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color-scheme: dark;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  @media (min-width: 1100px) {
    .team-grid-6,
    .team-grid-5,
    .team-grid-4 { grid-template-columns: repeat(6, 1fr); }
  }
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .kpi-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .kpi-value {
    font-size: 30px;
    font-weight: 700;
    font-feature-settings: 'tnum';
    letter-spacing: -0.02em;
  }
  .kpi-value.accent { color: var(--accent); }

  .table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead { background: var(--bg-elevated); }
  th, td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th[data-sort]::after { content: ' ⇅'; opacity: 0.3; font-size: 10px; }
  th.sort-asc::after { content: ' ↑'; opacity: 1; color: var(--accent); }
  th.sort-desc::after { content: ' ↓'; opacity: 1; color: var(--accent); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  td { font-size: 14px; font-feature-settings: 'tnum'; }
  td.rep-name { font-weight: 600; font-size: 15px; }
  .medal { margin-right: 6px; }

  .status {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 40px;
    border-radius: 12px;
    font-size: 14px;
    text-align: center;
    color: var(--text-dim);
  }
  .status.error {
    background: rgba(255,77,109,0.08);
    color: var(--danger);
    border-color: rgba(255,77,109,0.3);
  }

  .footnote {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-panel.hidden { display: none; }

  .monthly-controls {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .control-group select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
    cursor: pointer;
  }
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .chart-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 14px;
  }
  .chart-title {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .chart-card canvas {
    width: 100% !important;
    height: 260px !important;
  }
  .chart-def {
    opacity: 0.6;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    margin-left: 6px;
  }
  .chart-note {
    font-size: 11px;
    color: #ffb020;
    margin-bottom: 10px;
    padding: 6px 10px;
    background: rgba(255,176,32,0.08);
    border: 1px solid rgba(255,176,32,0.2);
    border-radius: 6px;
  }
</style>
</head>

let allRecords = [];
const PRESET_STORAGE_KEY = 'lastPreset_v1';
const _savedPreset = (() => { try { return localStorage.getItem(PRESET_STORAGE_KEY) || 'mtd'; } catch { return 'mtd'; } })();
let currentPreset = ['mtd','last-month','last-7','last-30','ytd','custom'].includes(_savedPreset) ? _savedPreset : 'mtd';
let currentRange = currentPreset === 'ytd' ? getYTDRange() : getMTDRange();
let currentRepFilter = 'all';  // 'all' or full rep name (e.g. 'Tyler Hoff')
let sortKey = 'contract';
let sortDir = 'desc';

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtDateDisplay(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtCurrency(n) {
  return '$' + Math.round(n || 0).toLocaleString();
}
function fmtPct(n) {
  if (!isFinite(n) || isNaN(n)) return '—';
  return (n * 100).toFixed(1) + '%';
}

function getMTDRange() {
  const now = new Date();
  return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: now };
}
function getLastMonthRange() {
  const now = new Date();
  return {
    start: new Date(now.getFullYear(), now.getMonth() - 1, 1),
    end: new Date(now.getFullYear(), now.getMonth(), 0)
  };
}
function getLastNDaysRange(n) {
  const end = new Date();
  const start = new Date();
  start.setDate(start.getDate() - n + 1);
  return { start, end };
}
function getYTDRange() {
  const now = new Date();
  return { start: new Date(now.getFullYear(), 0, 1), end: now };
}

async function fetchAllRecords() {
  const records = [];
  let offset;
  do {
    const params = new URLSearchParams();
    if (offset) params.set('offset', offset);
    const res = await fetch(`/api/airtable?${params}`);
    if (!res.ok) {
      const body = await res.text();
      throw new Error(`API ${res.status}: ${body.slice(0,150)}`);
    }
    const data = await res.json();
    records.push(...data.records);
    offset = data.offset;
  } while (offset);
  return records;
}

function repName(val) {
  if (!val) return null;
  return typeof val === 'string' ? val : val.name;
}

function blankTotals(label) {
  return { rep: label, slotsOpen: 0, scheduled: 0, live: 0, offersMade: 0, units: 0, contract: 0, cash: 0, dials: 0, pickups: 0, phoneSets: 0, dmSets: 0 };
}

function filterAndAggregate(range) {
  const r = range || currentRange;
  const startStr = fmtDate(r.start);
  const endStr = fmtDate(r.end);

  const filtered = allRecords.filter(rec => {
    const f = rec.fields;
    const date = f[FIELDS.date];
    const rep = repName(f[FIELDS.rep]);
    if (!date || !rep) return false;
    if (date < startStr || date > endStr) return false;
    if (currentRepFilter !== 'all' && rep !== currentRepFilter) return false;
    return true;
  });

  const byRep = {};
  for (const rec of filtered) {
    const f = rec.fields;
    const rep = repName(f[FIELDS.rep]);
    if (!byRep[rep]) byRep[rep] = blankTotals(rep);
    const b = byRep[rep];
    b.slotsOpen += f[FIELDS.slotsOpen] || 0;
    b.scheduled += f[FIELDS.scheduled] || 0;
    b.live += f[FIELDS.live] || 0;
    b.offersMade += f[FIELDS.offersMade] || 0;
    b.units += f[FIELDS.units] || 0;
    b.contract += f[FIELDS.contract] || 0;
    b.cash += f[FIELDS.cash] || 0;
    b.dials += f[FIELDS.dials] || 0;
    b.pickups += f[FIELDS.pickups] || 0;
    b.phoneSets += f[FIELDS.phoneSets] || 0;
    b.dmSets += f[FIELDS.dmSets] || 0;
  }
  for (const rep in byRep) {
    const b = byRep[rep];
    b.fillRate = b.slotsOpen ? b.scheduled / b.slotsOpen : 0;
    b.showRate = b.scheduled ? b.live / b.scheduled : 0;
    b.offerRate = b.live ? b.offersMade / b.live : 0;
    b.closeRate = b.live ? b.units / b.live : 0;
    b.revPerCall = b.scheduled ? b.contract / b.scheduled : 0;
    b.pickupRate = b.dials ? b.pickups / b.dials : 0;
  }

  const team = blankTotals('Team');
  for (const rep in byRep) {
    const b = byRep[rep];
    team.slotsOpen += b.slotsOpen;
    team.scheduled += b.scheduled;
    team.live += b.live;
    team.offersMade += b.offersMade;
    team.units += b.units;
    team.contract += b.contract;
    team.cash += b.cash;
    team.dials += b.dials;
    team.pickups += b.pickups;
    team.phoneSets += b.phoneSets;
    team.dmSets += b.dmSets;
  }
  team.fillRate = team.slotsOpen ? team.scheduled / team.slotsOpen : 0;
  team.showRate = team.scheduled ? team.live / team.scheduled : 0;
  team.offerRate = team.live ? team.offersMade / team.live : 0;
  team.closeRate = team.live ? team.units / team.live : 0;

  // Team-level financial metrics from Sales Tracking sheet (director's source of truth)
  // - totalCashCollected = sum col L for ALL rows in date range (incl. payment-plan installments)
  // - newCashCollected   = sum col L for rows where col M is NOT "PAYMENT PLAN" (upfront cash from new sales)
  // - sheetContract      = sum col M (contract value) for non-PAYMENT-PLAN rows in date range
  // - sheetUnits         = count of non-PAYMENT-PLAN rows in date range
  team.totalCashCollected = 0;
  team.newCashCollected = 0;
  team.sheetContract = 0;
  team.sheetUnits = 0;
  // When a rep filter is active, restrict sheet rows to that rep too. The sheet's `sp`
  // field stores the lowercase first name (e.g. "ian"), so derive that from the filter.
  const repFirstLower = currentRepFilter !== 'all'
    ? (currentRepFilter || '').trim().split(/\s+/)[0].toLowerCase()
    : null;
  for (const row of SALES_TRACKING) {
    if (row.d < startStr || row.d > endStr) continue;
    if (repFirstLower && row.sp !== repFirstLower) continue;
    team.totalCashCollected += row.c;
    if (!row.pp) {
      team.newCashCollected += row.c;
      team.sheetContract += (row.k || 0);
      team.sheetUnits += (row.u || 0);
    }
  }
  // Units Sold sourced from sheet (counts new-sale rows). Contract Value stays Airtable-sourced
  // (reps enter full contract in Airtable for now; sheet is reserved for cash truth).
  team.units = team.sheetUnits;
  team.revPerCall = team.scheduled ? team.contract / team.scheduled : 0;
  team.pickupRate = team.dials ? team.pickups / team.dials : 0;

  return { reps: Object.values(byRep), team, rowCount: filtered.length };
}

  const sorted = [...reps].sort((a, b) => {
    const av = a[sortKey] || 0;
    const bv = b[sortKey] || 0;
    return sortDir === 'desc' ? bv - av : av - bv;
  });

  const kpis = ['slotsOpen', 'scheduled', 'live', 'offersMade', 'fillRate', 'showRate', 'offerRate', 'closeRate', 'units', 'contract', 'cash', 'dials', 'pickups', 'phoneSets', 'dmSets'];
  const ranks = {};
  for (const k of kpis) {
    const sortedByK = [...reps].sort((a,b) => (b[k]||0) - (a[k]||0));
    ranks[k] = {};
    sortedByK.forEach((r, i) => { ranks[k][r.rep] = i + 1; });

  function medal(rank, val) {

  }

  const rowsHtml = sorted.map(r => `

function mondayOf(d) {
  const out = new Date(d);
  const day = out.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  out.setDate(out.getDate() + diff);
  out.setHours(0, 0, 0, 0);
  return out;
}

function getAllWeeks() {
  let earliest = null;
  for (const r of allRecords) {
    const date = r.fields[FIELDS.date];
    const rep = repName(r.fields[FIELDS.rep]);
    if (!date || !rep) continue;
    if (!earliest || date < earliest) earliest = date;
  }
  if (!earliest) return [];

  const earliestDate = new Date(earliest + 'T00:00:00');
  const firstMonday = mondayOf(earliestDate);
  const thisMonday = mondayOf(new Date());
  const weeks = [];
  const cursor = new Date(firstMonday);
  while (cursor <= thisMonday) {
    const start = new Date(cursor);
    const end = new Date(cursor);
    end.setDate(end.getDate() + 6);
    end.setHours(23, 59, 59, 999);
    weeks.push({ start, end });
    cursor.setDate(cursor.getDate() + 7);
  }
  return weeks.reverse();
}

function fmtWeekLabel(start, end) {
  const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
  const s = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const e = sameMonth
    ? end.toLocaleDateString('en-US', { day: 'numeric' })
    : end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return `${s} – ${e}, ${end.getFullYear()}`;
}

function getAllMonthKeys() {
  const keys = new Set();
  for (const r of allRecords) {

    if (date && rep) keys.add(date.slice(0, 7));

function fmtMonth(key) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('en-US', { month: 'short', year: 'numeric' });
}

// Hardcoded override for October 2025 — Airtable EOD reporting was incomplete that month.
// Sourced from the Sales Tracking + Call Tracking Google Sheets. ONLY applied when monthKey === '2025-10'.
const OCTOBER_OVERRIDES = {
  // "cash" = NEW cash only (excludes rows where col M is "PAYMENT PLAN" — those are recurring installments)
  // "units" = NEW sales only (same exclusion)
  team:           { contract: 162601.20, cash: 114502.00, scheduled: 195, units: 47 },
  'Tyler Hoff':   { contract: 76556.30,  cash: 48915.30,  scheduled: 97,  units: 26 },
  'Ian Kirk':     { contract: 57244.90,  cash: 45764.30,  scheduled: 81,  units: 12 },
  'Daniel Hussain': { contract: 0,       cash: 2192.40,   scheduled: 16,  units: 5 }
};

function aggregateMonth(monthKey, repFilter) {
  const [y, m] = monthKey.split('-').map(Number);
  const start = new Date(y, m - 1, 1);
  const end = new Date(y, m, 0, 23, 59, 59);
  const { reps, team } = filterAndAggregate({ start, end });
  const base = repFilter === '__team__'
    ? team
    : (reps.find(r => r.rep === repFilter) || blankTotals(repFilter));

  if (monthKey === '2025-10') {
    const ov = repFilter === '__team__' ? OCTOBER_OVERRIDES.team : OCTOBER_OVERRIDES[repFilter];
    if (ov) {
      const result = { ...base, ...ov };
      result.revPerCall = result.scheduled ? result.contract / result.scheduled : 0;
      // Assumed rates for October — Live Calls couldn't be reconciled, so use baseline assumption
      result.showRate = 0.70;
      result.closeRate = 0.30;
      return result;
    }
  }
  return base;
}

function renderMonthly() {
  if (!allRecords.length) return;
  const repFilter = document.getElementById('monthlyRep').value;
  const fromKey = document.getElementById('monthlyFrom').value;
  const toKey = document.getElementById('monthlyTo').value;
  const allMonths = getAllMonthKeys();
  const monthsInRange = allMonths.filter(k => k >= fromKey && k <= toKey);

  if (!monthsInRange.length) {
    document.getElementById('monthlyContent').innerHTML = '<div class="status">No months in range</div>';
    return;
  }

  const monthData = monthsInRange.map(k => ({
    label: fmtMonth(k),
    totals: aggregateMonth(k, repFilter)
  }));

  const cardsHtml = MONTHLY_METRICS.map(m => `
    <div class="chart-card">
      <div class="chart-title">${m.label}${m.def ? ` <span class="chart-def">${m.def}</span>` : ''}</div>
      <canvas id="chart-${m.key}"></canvas>
    </div>
  `).join('');
  document.getElementById('monthlyContent').innerHTML = `<div class="charts-grid">${cardsHtml}</div>`;

  if (window.ChartDataLabels && !Chart.registry.plugins.get('datalabels')) {
    Chart.register(window.ChartDataLabels);
  }

  for (const m of MONTHLY_METRICS) {
    const ctx = document.getElementById(`chart-${m.key}`).getContext('2d');
    if (monthlyCharts[m.key]) monthlyCharts[m.key].destroy();
    const labels = monthData.map(md => md.label);
    const data = monthData.map(md => md.totals[m.key] || 0);
    const fmtVal = (v) => {
      if (m.fmt === 'currency') {
        if (v >= 1000) return '$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k';
        return '$' + Math.round(v).toLocaleString();
      }
      if (m.fmt === 'pct') return (v * 100).toFixed(1) + '%';
      return v.toLocaleString();
    };
    monthlyCharts[m.key] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data,
          backgroundColor: `rgba(${m.color},0.55)`,
          borderColor: `rgba(${m.color},1)`,
          borderWidth: 1,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 24 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (c) => fmtVal(c.parsed.y)
            }
          },
          datalabels: {
            anchor: 'end',
            align: 'top',
            offset: 4,
            color: '#e6e9ef',
            font: { weight: '600', size: 11 },
            formatter: (v) => v ? fmtVal(v) : ''
          }
        },
        scales: {
          x: { ticks: { color: '#8a93a6' }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: {
            beginAtZero: true,
            ticks: {
              color: '#8a93a6',
              callback: (v) => {
                if (m.fmt === 'currency') return '$' + (v >= 1000 ? (v/1000).toFixed(0) + 'k' : v);
                if (m.fmt === 'pct') return (v * 100).toFixed(0) + '%';
                return v;
              }
            },
            grid: { color: 'rgba(255,255,255,0.04)' }
          }
        }
      }
    });
  }
}

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="status">Loading sales data…</div>';
  try {
    allRecords = await fetchAllRecords();
    document.getElementById('updated').textContent =
      `Updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
    // Restore saved preset (highlights button, sets correct range, then renders).
    applyPreset(currentPreset);
    renderWeekly();
    populateMonthlyControls();
    renderMonthly();
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="status error">Failed to load: ${e.message}</div>`;
  }
}

function applyPreset(preset) {
  currentPreset = preset;
  try { localStorage.setItem(PRESET_STORAGE_KEY, preset); } catch {}
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.preset === preset);
  });
  document.getElementById('customRange').classList.toggle('visible', preset === 'custom');

  switch (preset) {
    case 'mtd': currentRange = getMTDRange(); break;
    case 'last-month': currentRange = getLastMonthRange(); break;
    case 'last-7': currentRange = getLastNDaysRange(7); break;
    case 'last-30': currentRange = getLastNDaysRange(30); break;
    case 'ytd': currentRange = getYTDRange(); break;
    case 'custom': {
      const s = document.getElementById('startDate').value;
      const e = document.getElementById('endDate').value;
      if (s && e) currentRange = {
        start: new Date(s + 'T00:00:00'),
        end: new Date(e + 'T23:59:59')
      };
      break;
    }
  }
  if (allRecords.length) render();
}

});

  // Only rebuild options if the set changed (avoids resetting selection)
  const currentOptions = Array.from(sel.options).map(o => o.value).join('|');

    inWindow = cd => cd >= cutoff;

    const [y, m] = callsWindow.split('-').map(Number);

    const monthEnd = new Date(y, m, 1);

    inWindow = cd => cd >= monthStart && cd < monthEnd;

  // Filter calls in window — including future ones too (Mason wants the full call ledger)
  const calls = CALL_TRACKING.filter(c => {

    return !isNaN(cd) && inWindow(cd);
  });

  const reps = [...new Set(calls.map(c => c.sp || '(unassigned)'))].sort();

      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:24px">No calls in this window.</td></tr>'}</tbody>
    </table></div>
    ${filteredCalls.length > 500 ? `<div class="footnote">Showing first 500 of ${filteredCalls.length}. Filter by month or rep to narrow.</div>` : ''}
    <div class="footnote">
      <strong>Source:</strong> Sales Call Tracking 2025 (Call Tracking tab) — Date of Call · Salesperson · Lead Interest (post-call form) · Fathom share URL.<br>
      <strong>Fathom matching:</strong> by client email + ±4 hour window. Fathom rolling 30-day window means older calls (>30 days) won't have a link even if a recording existed.
    </div>
  `;

  root.innerHTML = windowSelector + summary + tableHtml;
}


// ===== Revenue Pace Charts (Overview tab, below leaderboard) =====
// Three side-by-side charts: Contract Value, New Cash, Total Cash. Each shows
// MTD actual + a projection to month-end based on day-over-day delta average
// (excluding day 1, which usually has loaded installments / a single big sale).
const __paceCharts = {};

const PACE_METRICS = [
  { key: 'contract', shortLabel: 'Contract Value',
    note: 'Total contract value of new deals booked (excludes payment-plan installments).',
    color: 'rgba(99, 179, 237, 1)', fill: 'rgba(99, 179, 237, 0.15)',
    defaultGoals: { month: 150000, year: 0 } },
];

// Per-metric per-period goals — linear pace line from (day 1, $0) to (last day, goal).
// Stored in localStorage as flat keys like "contract_month" and "contract_year".
// 0 = no goal line shown.
const PACE_GOALS_KEY = 'paceGoals_v2';
function getPaceGoals(periodKind) {
  try {
    const stored = JSON.parse(localStorage.getItem(PACE_GOALS_KEY) || '{}');
    const out = {};
    for (const m of PACE_METRICS) {
      const k = `${m.key}_${periodKind}`;
      out[m.key] = (k in stored) ? Number(stored[k]) : ((m.defaultGoals && m.defaultGoals[periodKind]) || 0);
    }
    return out;
  } catch {
    return Object.fromEntries(PACE_METRICS.map(m => [m.key, (m.defaultGoals && m.defaultGoals[periodKind]) || 0]));
  }
}
function setPaceGoal(key, periodKind, value) {
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(PACE_GOALS_KEY) || '{}'); } catch {}
  stored[`${key}_${periodKind}`] = Number(value) || 0;
  localStorage.setItem(PACE_GOALS_KEY, JSON.stringify(stored));
}

// Returns the active pacing period — month or year — based on currentPreset.
// All pace charts use the same period; switching the date-range buttons rebuilds them.
function getPacePeriod() {
  const now = new Date();
  if (currentPreset === 'ytd') {
    const yr = now.getFullYear();
    const start = new Date(yr, 0, 1);
    const endExcl = new Date(yr + 1, 0, 1);
    const totalDays = Math.round((endExcl - start) / 86400000);
    const elapsedDays = Math.floor((now - start) / 86400000) + 1;
    return {
      kind: 'year',
      start, totalDays, elapsedDays,
      filterFn: r => r.d && r.d.slice(0, 4) === String(yr),
      indexOf: r => Math.floor((new Date(r.d + 'T00:00:00') - start) / 86400000),
      label: String(yr),
      shortNoun: 'YTD',
      titleSuffix: 'Year to Date',
      xAxisTitle: 'Day of year',
      maxXTicks: 12,
    };
  }
  const yr = now.getFullYear();
  const mo = now.getMonth();
  const start = new Date(yr, mo, 1);
  const endExcl = new Date(yr, mo + 1, 1);
  const totalDays = (endExcl - start) / 86400000;
  const elapsedDays = now.getDate();
  const monthPrefix = `${yr}-${String(mo + 1).padStart(2, '0')}`;
  return {
    kind: 'month',
    start, totalDays, elapsedDays,
    filterFn: r => r.d && r.d.slice(0, 7) === monthPrefix,
    indexOf: r => parseInt(r.d.slice(8, 10), 10) - 1,
    label: start.toLocaleString('en-US', { month: 'long', year: 'numeric' }),
    shortNoun: 'MTD',
    titleSuffix: 'Current Month',
    xAxisTitle: 'Day of month',
    maxXTicks: 31,
  };
}

function buildPaceChart() {
  const period = getPacePeriod();
  const goals = getPaceGoals(period.kind);
  const goalsHeader = period.kind === 'year' ? 'YTD goals (by year end)' : 'Monthly goals (by end of month)';
  const goalSuffix = period.kind === 'year' ? 'YTD goal' : 'goal';
  const cards = PACE_METRICS.map(m => `
    <div class="chart-card">
      <div class="chart-title">${m.shortLabel} · ${period.titleSuffix}</div>
      <div id="paceHeadline-${m.key}" style="margin-bottom:8px;font-size:13px;color:var(--text-dim);min-height:36px"></div>
      <canvas id="paceChart-${m.key}" style="max-height:260px"></canvas>
      <div class="chart-note">${m.note}</div>
    </div>
  `).join('');
  const goalInputs = PACE_METRICS.map(m => `
    <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em">
      ${m.shortLabel} ${goalSuffix}
      <span style="display:inline-flex;align-items:center;gap:4px;background:#0d1220;border:1px solid #232a3d;border-radius:6px;padding:6px 10px">
        <span style="color:#8a93a6">$</span>
        <input type="number" min="0" step="1000" data-pace-goal="${m.key}" data-pace-period="${period.kind}"
               value="${goals[m.key] || ''}" placeholder="0"
               style="background:transparent;border:0;color:var(--text);font-size:14px;font-weight:600;width:110px;outline:none;text-transform:none;letter-spacing:0" />
      </span>
    </label>
  `).join('');
  return `
    <div class="section-title" style="margin-top:32px">Revenue Pace · ${period.titleSuffix}</div>
    <div class="table-wrap" style="padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <div style="font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em">${goalsHeader}</div>
      ${goalInputs}
      <div style="font-size:11px;color:var(--text-dim);margin-left:auto">Set 0 to hide goal line · saved locally</div>
    </div>
    <div class="charts-grid">${cards}</div>
  `;
}

function paceDailyAmount(row, metricKey) {
  if (metricKey === 'contract') return row.pp ? 0 : (row.k || 0);
  if (metricKey === 'newcash')  return row.pp ? 0 : (row.c || 0);
  return row.c || 0;
}

function renderPaceChart() {
  if (typeof SALES_TRACKING === 'undefined') return;
  const period = getPacePeriod();
  const { totalDays, elapsedDays, label: periodLabel, shortNoun, xAxisTitle, maxXTicks } = period;
  const labels = Array.from({ length: totalDays }, (_, i) => i + 1);

  for (const m of PACE_METRICS) {
    const canvas = document.getElementById(`paceChart-${m.key}`);
    const headline = document.getElementById(`paceHeadline-${m.key}`);
    if (!canvas) continue;

    const daily = new Array(totalDays).fill(0);
    for (const r of SALES_TRACKING) {
      if (!period.filterFn(r)) continue;
      const idx = period.indexOf(r);
      if (idx >= 0 && idx < totalDays) daily[idx] += paceDailyAmount(r, m.key);
    }

    const cumActual = [];
    let runTotal = 0;
    for (let i = 0; i < totalDays; i++) {
      if (i < elapsedDays) { runTotal += daily[i]; cumActual.push(runTotal); }
      else cumActual.push(null);
    }
    const mtdTotal = cumActual[elapsedDays - 1] || 0;
    const dailyAvg = elapsedDays > 0 ? mtdTotal / elapsedDays : 0;
    const projection = mtdTotal + dailyAvg * (totalDays - elapsedDays);

    const projLine = [];
    for (let i = 0; i < totalDays; i++) {
      if (i < elapsedDays - 1) projLine.push(null);
      else if (i === elapsedDays - 1) projLine.push(mtdTotal);
      else projLine.push(mtdTotal + dailyAvg * (i - (elapsedDays - 1)));
    }

    if (headline) {
      headline.innerHTML = `
        <strong style="color:var(--text)">${periodLabel}</strong> ·
        <strong style="color:${m.color};font-size:17px">${fmtCurrency(mtdTotal)}</strong> ${shortNoun}
        (day ${elapsedDays}/${totalDays}). Pacing toward
        <strong style="color:${m.color};font-size:17px">${fmtCurrency(projection)}</strong>
        @ ${fmtCurrency(dailyAvg)}/day.
      `;
    }

    // Format helper for end-of-line labels: $1.82M, $216k, $41.8k, $123.
    const fmtCompact = v => {
      const n = Math.round(v || 0);
      const abs = Math.abs(n);
      if (abs >= 1000000) return '$' + (n / 1000000).toFixed(2).replace(/\.?0+$/, '') + 'M';
      if (abs >= 1000) return '$' + (n / 1000).toFixed(abs >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'k';
      return '$' + n.toLocaleString();
    };

    // Goal line — linear from (day 1, $0) to (last day of period, goalValue).
    // Works for both monthly and yearly periods.
    let goalDataset = null;
    const goals = getPaceGoals(period.kind);
    const goalValue = goals[m.key];
    if (goalValue > 0) {
      const slope = goalValue / (totalDays - 1);
      const goalLine = labels.map(d => (d - 1) * slope);
      const endLabel = period.kind === 'year' ? 'by year end' : 'by month end';
      goalDataset = {
        label: `Goal pace (${fmtCompact(goalValue)} ${endLabel})`,
        data: goalLine,
        borderColor: 'rgba(150, 160, 180, 0.7)',
        borderDash: [2, 4],
        fill: false,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0,
      };
    }
    // Index of last non-null value in a dataset (for the "where we are now" label on Actual).
    const lastNonNullIndex = data => {
      for (let i = data.length - 1; i >= 0; i--) if (data[i] != null) return i;
      return -1;
    };
    const projLastIdx = projLine.length - 1;
    const actualLastIdx = lastNonNullIndex(cumActual);

    // Attach datalabels override to projection + goal datasets — show only on last point.
    const projDataset = {
      label: 'Projected (current pace)',
      data: projLine,
      borderColor: 'rgba(255, 210, 70, 0.95)',
      borderDash: [6, 4],
      fill: false,
      borderWidth: 2,
      pointRadius: ctx => ctx.dataIndex === projLastIdx ? 4 : 0,
      pointBackgroundColor: 'rgba(255, 210, 70, 1)',
      tension: 0,
      datalabels: {
        display: ctx => ctx.dataIndex === projLastIdx,
        color: 'rgba(255, 210, 70, 1)',
        anchor: 'end', align: 'right', offset: 6,
        font: { weight: 'bold', size: 12 },
        formatter: v => fmtCompact(v),
      },
    };
    if (goalDataset) {
      const goalLastIdx = lastNonNullIndex(goalDataset.data);
      goalDataset.pointRadius = ctx => ctx.dataIndex === goalLastIdx ? 4 : 0;
      goalDataset.pointBackgroundColor = 'rgba(180, 190, 210, 1)';
      goalDataset.datalabels = {
        display: ctx => ctx.dataIndex === goalLastIdx,
        color: 'rgba(180, 190, 210, 1)',
        anchor: 'end', align: 'right', offset: 6,
        font: { weight: 'bold', size: 12 },
        formatter: v => fmtCompact(v),
      };
    }

    if (__paceCharts[m.key]) __paceCharts[m.key].destroy();
    __paceCharts[m.key] = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: `Actual ${shortNoun}`,
            data: cumActual,
            borderColor: m.color,
            backgroundColor: m.fill,
            fill: true,
            borderWidth: 3,
            pointRadius: ctx => ctx.dataIndex === actualLastIdx ? 5 : (period.kind === 'year' ? 0 : 2),
            pointBackgroundColor: m.color,
            tension: 0.2,
            spanGaps: false,
            datalabels: {
              display: ctx => ctx.dataIndex === actualLastIdx,
              color: m.color,
              anchor: 'end', align: 'top', offset: 8,
              font: { weight: 'bold', size: 12 },
              formatter: v => fmtCompact(v),
            },
          },
          projDataset,
          ...(goalDataset ? [goalDataset] : []),
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { right: 56, top: 16 } },
        plugins: {
          legend: { labels: { color: '#e6e9ef', font: { size: 11 } } },
          datalabels: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => `${ctx.dataset.label}: $${(ctx.parsed.y || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}`,
              title: items => `Day ${items[0].label}`
            }
          }
        },
        scales: {
          x: { ticks: { color: '#8a93a6', maxTicksLimit: maxXTicks, autoSkip: true },
               grid: { color: '#232a3d' },
               title: { display: true, text: xAxisTitle, color: '#8a93a6' } },
          y: { ticks: { color: '#8a93a6', callback: v => '$' + v.toLocaleString() }, grid: { color: '#232a3d' } }
        }
      }
    });
  }
}


// ===== Setters Tab =====
// Pacing chart for Daniel's daily sets (phone + DM) toward a monthly goal.
// Y axis = (phoneSets + dmSets) cumulative MTD. Goal pace line + current-pace projection.
const SETTER_GOAL_KEY = 'setterGoal_v1';
const SETTER_DEFAULT_GOAL = 120;
const SETTER_NAME_MATCH = /^daniel\b/i;  // matches "Daniel Hussain", "Daniel", etc.
let __setterChart = null;

function getSetterGoal() {
  try {
    const v = Number(localStorage.getItem(SETTER_GOAL_KEY));
    return v > 0 ? v : SETTER_DEFAULT_GOAL;
  } catch { return SETTER_DEFAULT_GOAL; }
}
function setSetterGoal(v) {
  try { localStorage.setItem(SETTER_GOAL_KEY, String(Number(v) || 0)); } catch {}
}

function renderSetters() {
  const root = document.getElementById('settersContent');
  if (!root) return;

  if (!allRecords || !allRecords.length) {
    root.innerHTML = '<div class="status">Loading setter data…</div>';
    return;
  }

  const now = new Date();
  const yr = now.getFullYear();
  const mo = now.getMonth();
  const monthStart = new Date(yr, mo, 1);
  const daysInMonth = new Date(yr, mo + 1, 0).getDate();
  const elapsedDays = now.getDate();
  const monthName = monthStart.toLocaleString('en-US', { month: 'long', year: 'numeric' });

  // Sum Daniel's phone+DM sets per day-of-month for current month.
  // IMPORTANT: parse the date string as a local-tz date. Airtable returns "YYYY-MM-DD"
  // and `new Date(s)` treats that as UTC midnight, which shifts to the previous day in
  // Pacific time and dropped the 1st-of-month entries from the bucket.
  const dailyMTD = new Array(daysInMonth).fill(0);
  for (const r of allRecords) {
    const f = r.fields || {};
    const repField = f[FIELDS.rep];
    const repName = typeof repField === 'string' ? repField : (repField && repField.name) || '';
    if (!SETTER_NAME_MATCH.test(repName)) continue;
    const dateStr = f[FIELDS.date];
    if (!dateStr) continue;
    const parts = String(dateStr).slice(0, 10).split('-').map(Number);
    if (parts.length < 3 || parts.some(isNaN)) continue;
    if (parts[0] !== yr || parts[1] !== mo + 1) continue;
    const day = parts[2];
    if (day < 1 || day > daysInMonth) continue;
    dailyMTD[day - 1] += (Number(f[FIELDS.phoneSets]) || 0) + (Number(f[FIELDS.dmSets]) || 0);
  }

  // Cumulative actual through today
  const cumActual = [];
  let runTotal = 0;
  for (let i = 0; i < daysInMonth; i++) {
    if (i < elapsedDays) { runTotal += dailyMTD[i]; cumActual.push(runTotal); }
    else cumActual.push(null);
  }
  const mtdTotal = cumActual[elapsedDays - 1] || 0;
  const dailyAvg = elapsedDays > 0 ? mtdTotal / elapsedDays : 0;
  const projection = mtdTotal + dailyAvg * (daysInMonth - elapsedDays);

  // Projection line (anchored at today)
  const projLine = [];
  for (let i = 0; i < daysInMonth; i++) {
    if (i < elapsedDays - 1) projLine.push(null);
    else if (i === elapsedDays - 1) projLine.push(mtdTotal);
    else projLine.push(mtdTotal + dailyAvg * (i - (elapsedDays - 1)));
  }

  // Goal line: $0 day 1 → goal at last day of month
  const goalValue = getSetterGoal();
  const goalSlope = goalValue / (daysInMonth - 1);
  const goalLine = Array.from({ length: daysInMonth }, (_, i) => i * goalSlope);

  const labels = Array.from({ length: daysInMonth }, (_, i) => i + 1);
  const todayPace = (elapsedDays / daysInMonth) * goalValue;
  const vsPace = mtdTotal - todayPace;
  const vsPaceColor = vsPace >= 0 ? 'rgba(0, 208, 132, 1)' : 'rgba(255, 99, 99, 1)';
  const vsPaceLabel = vsPace >= 0 ? 'ahead of pace' : 'behind pace';

  root.innerHTML = `
    <div class="section-title">Setters · Daniel · ${monthName}</div>
    <div class="table-wrap" style="padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <div style="font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em">Monthly goal (sets by month end)</div>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em">
        Daniel goal
        <span style="display:inline-flex;align-items:center;gap:4px;background:#0d1220;border:1px solid #232a3d;border-radius:6px;padding:6px 10px">
          <input type="number" min="0" step="10" id="setterGoalInput"
                 value="${goalValue}" placeholder="120"
                 style="background:transparent;border:0;color:var(--text);font-size:14px;font-weight:600;width:90px;outline:none;text-transform:none;letter-spacing:0" />
          <span style="color:#8a93a6;font-size:12px">sets</span>
        </span>
      </label>
      <div style="font-size:11px;color:var(--text-dim);margin-left:auto">Phone Sets + DM Sets · saved locally</div>
    </div>
    <div class="chart-card">
      <div id="setterHeadline" style="margin-bottom:12px;font-size:13px;color:var(--text-dim);min-height:36px"></div>
      <canvas id="setterChart" style="max-height:340px"></canvas>
      <div class="chart-note">Daniel's combined Phone Sets + DM Sets, cumulative MTD with current-pace projection and goal pace line.</div>
    </div>

    <div class="section-title" style="margin-top:32px">Qualified Shows · Last 6 Months</div>
    <div class="chart-card">
      <div id="qualifiedShowsHeadline" style="margin-bottom:12px;font-size:13px;color:var(--text-dim);min-height:36px"></div>
      <canvas id="qualifiedShowsChart" style="max-height:340px"></canvas>
      <div class="chart-note">Qualified shows = calls in "Lead Generation Consultation 🤝" calendar where Lead Quality starts with "Qualified". This is what defines Daniel's payable performance.</div>
    </div>
  `;

  document.getElementById('setterHeadline').innerHTML = `
    <strong style="color:var(--text)">${monthName}</strong> ·
    <strong style="color:rgba(99, 179, 237, 1);font-size:17px">${mtdTotal}</strong> sets MTD
    (day ${elapsedDays}/${daysInMonth}). Pacing toward
    <strong style="color:rgba(99, 179, 237, 1);font-size:17px">${Math.round(projection)}</strong>
    @ ${dailyAvg.toFixed(1)} sets/day. Goal:
    <strong style="color:var(--text)">${goalValue}</strong> —
    <strong style="color:${vsPaceColor}">${Math.abs(Math.round(vsPace))} ${vsPaceLabel}</strong>.
  `;

  document.getElementById('setterGoalInput').addEventListener('input', e => {
    setSetterGoal(e.target.value);
    renderSetters();
  });

  const canvas = document.getElementById('setterChart');
  if (__setterChart) __setterChart.destroy();

  const projLastIdx = projLine.length - 1;
  const goalLastIdx = goalLine.length - 1;
  const lastNonNullIndex = data => {
    for (let i = data.length - 1; i >= 0; i--) if (data[i] != null) return i;
    return -1;
  };
  const actualLastIdx = lastNonNullIndex(cumActual);

  __setterChart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Actual MTD',
          data: cumActual,
          borderColor: 'rgba(99, 179, 237, 1)',
          backgroundColor: 'rgba(99, 179, 237, 0.15)',
          fill: true,
          borderWidth: 3,
          pointRadius: ctx => ctx.dataIndex === actualLastIdx ? 5 : 2,
          pointBackgroundColor: 'rgba(99, 179, 237, 1)',
          tension: 0.2,
          spanGaps: false,
          datalabels: {
            display: ctx => ctx.dataIndex === actualLastIdx,
            color: 'rgba(99, 179, 237, 1)',
            anchor: 'end', align: 'top', offset: 8,
            font: { weight: 'bold', size: 12 },
            formatter: v => Math.round(v),
          },
        },
        {
          label: 'Projected (current pace)',
          data: projLine,
          borderColor: 'rgba(255, 210, 70, 0.95)',
          borderDash: [6, 4],
          fill: false,
          borderWidth: 2,
          pointRadius: ctx => ctx.dataIndex === projLastIdx ? 4 : 0,
          pointBackgroundColor: 'rgba(255, 210, 70, 1)',
          tension: 0,
          datalabels: {
            display: ctx => ctx.dataIndex === projLastIdx,
            color: 'rgba(255, 210, 70, 1)',
            anchor: 'end', align: 'right', offset: 6,
            font: { weight: 'bold', size: 12 },
            formatter: v => Math.round(v),
          },
        },
        {
          label: `Goal pace (${goalValue} sets by month end)`,
          data: goalLine,
          borderColor: 'rgba(150, 160, 180, 0.7)',
          borderDash: [2, 4],
          fill: false,
          borderWidth: 2,
          pointRadius: ctx => ctx.dataIndex === goalLastIdx ? 4 : 0,
          pointBackgroundColor: 'rgba(180, 190, 210, 1)',
          tension: 0,
          datalabels: {
            display: ctx => ctx.dataIndex === goalLastIdx,
            color: 'rgba(180, 190, 210, 1)',
            anchor: 'end', align: 'right', offset: 6,
            font: { weight: 'bold', size: 12 },
            formatter: v => Math.round(v),
          },
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { right: 56, top: 16 } },
      plugins: {
        legend: { labels: { color: '#e6e9ef', font: { size: 11 } } },
        datalabels: { display: false },

            title: items => `Day ${items[0].label}`

      },
      scales: {

             title: { display: true, text: 'Day of month', color: '#8a93a6' } },
        y: { ticks: { color: '#8a93a6' }, grid: { color: '#232a3d' },
             title: { display: true, text: 'Sets', color: '#8a93a6' } }
      }
    }
  });

  renderQualifiedShowsChart();
}

let __qualifiedShowsChart = null;
function renderQualifiedShowsChart() {
  const canvas = document.getElementById('qualifiedShowsChart');
  if (!canvas || typeof CALL_TRACKING === 'undefined') return;

  // Build last 6 month buckets ending at current month
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const label = d.toLocaleString('en-US', { month: 'short', year: '2-digit' });
    months.push({ ym, label, count: 0 });
  }
  const monthMap = Object.fromEntries(months.map(m => [m.ym, m]));

  // Count qualified shows per month from CALL_TRACKING.
  // Qualified show = calendar starts with "Lead Generation Consultation" AND lead quality
  // starts with "Qualified". Attribute to BOOKING DATE (col A) since that's when the
  // setter did the work and matches Daniel's pay rule. Falls back to call date if booking
  // date is missing (older rows where db wasn't captured).
  for (const c of CALL_TRACKING) {
    if (!c.c || !c.lq) continue;
    const calLower = c.c.toLowerCase();
    if (!calLower.startsWith('lead generation consultation')) continue;
    if (!c.lq.toLowerCase().startsWith('qualified')) continue;
    const dateStr = c.db || c.dc;
    if (!dateStr) continue;
    const ym = dateStr.slice(0, 7);
    if (monthMap[ym]) monthMap[ym].count++;
  }

  const labels = months.map(m => m.label);
  const counts = months.map(m => m.count);
  const total = counts.reduce((a, b) => a + b, 0);
  const avg = (total / counts.length).toFixed(1);
  const currentMonth = counts[counts.length - 1];

  document.getElementById('qualifiedShowsHeadline').innerHTML = `
    <strong style="color:var(--text)">Last 6 months:</strong>
    <strong style="color:rgba(0, 208, 132, 1);font-size:17px"> ${total}</strong> qualified shows ·
    avg <strong>${avg}</strong>/month ·
    this month so far: <strong style="color:rgba(99, 179, 237, 1);font-size:17px">${currentMonth}</strong>
  `;

  if (__qualifiedShowsChart) __qualifiedShowsChart.destroy();
  __qualifiedShowsChart = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Qualified shows',
        data: counts,
        backgroundColor: counts.map((_, i) => i === counts.length - 1
          ? 'rgba(99, 179, 237, 0.85)'   // current month — blue
          : 'rgba(0, 208, 132, 0.7)'),    // past months — green
        borderColor: counts.map((_, i) => i === counts.length - 1
          ? 'rgba(99, 179, 237, 1)'
          : 'rgba(0, 208, 132, 1)'),
        borderWidth: 2,
        borderRadius: 6,
        datalabels: {
          display: true,
          color: '#e6e9ef',
          anchor: 'end', align: 'top', offset: 4,
          font: { weight: 'bold', size: 13 },
          formatter: v => v,
        },
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 24 } },
      plugins: {
        legend: { display: false },
        datalabels: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.parsed.y} qualified shows`
          }
        }
      },
      scales: {
        x: { ticks: { color: '#8a93a6' }, grid: { color: '#232a3d' } },
        y: { ticks: { color: '#8a93a6', precision: 0 }, grid: { color: '#232a3d' },
             title: { display: true, text: 'Qualified shows', color: '#8a93a6' },
             beginAtZero: true }
      }
    }
  });
}


// ===== Compliance Tab =====
// Compliance window: rolling last 90 days.
// Compliance = closer filled out the post-call form. ANY post-call field populated counts.
// (Form-filled flag `f` set in refresh script: any of Lead Interest, Lead Quality, Notes,
//  Deal Closed, Monthly Revenue, B2 Model populated in the Call Tracking sheet row.)
const COMPLIANCE_WINDOW_DAYS = 90;
let complianceLoaded = false;
let overdueFilter = 'all';  // 'all' | rep first name (lowercase)
// Default to current month (e.g., "2026-05") so the dashboard opens on this month's spot-check.
// User can switch to "last90" for rolling 90-day rollup via the dropdown.
let complianceWindow = (() => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
})();

function renderCompliance() {
  complianceLoaded = true;
  const root = document.getElementById('complianceContent');

  if (typeof CALL_TRACKING === 'undefined' || !CALL_TRACKING.length) {
    root.innerHTML = '<div class="status">No Call Tracking data available. Run the daily refresh to populate.</div>';
    return;
  }

  const now = new Date();

  // Determine the window — either rolling 90d or a specific month
  let windowLabel;
  let inWindow;
  if (complianceWindow === 'last90') {
    const cutoff = new Date(now.getTime() - COMPLIANCE_WINDOW_DAYS * 86400000);
    windowLabel = `last ${COMPLIANCE_WINDOW_DAYS}d`;
    inWindow = cd => cd >= cutoff && cd <= now;
  } else {
    const [y, m] = complianceWindow.split('-').map(Number);
    const monthStart = new Date(y, m - 1, 1);
    const monthEnd = new Date(y, m, 1);  // first day of next month
    windowLabel = monthStart.toLocaleString('en-US', { month: 'long', year: 'numeric' });
    inWindow = cd => cd >= monthStart && cd < monthEnd;
  }

  // Direct read of Call Tracking sheet — every row is one call.
  // Only count past-dated calls (future bookings can't have a form yet).
  // Exclude synthetic Fathom-only rows (no scheduled call → no form expected).
  const calls = CALL_TRACKING.filter(c => {
    if (!c.dc) return false;
    if (c.c === 'Fathom recording') return false;
    const cd = new Date(c.dc);
    if (isNaN(cd)) return false;
    if (cd > now) return false;
    return inWindow(cd);
  });

  // Build list of months that have data, most-recent-first
  const monthsWithData = [...new Set(CALL_TRACKING
    .filter(c => c.dc)
    .map(c => c.dc.slice(0, 7))
  )].sort().reverse();

  const perCloser = {};
  const overdueList = [];
  let teamCalls = 0, teamForms = 0, teamOverdue = 0;

  for (const c of calls) {
    const closer = c.sp || '(unassigned)';
    if (!perCloser[closer]) perCloser[closer] = { calls: 0, forms: 0, overdue: 0 };
    perCloser[closer].calls++; teamCalls++;

    if (c.f) {
      perCloser[closer].forms++; teamForms++;
    } else {
      const callDate = new Date(c.dc);
      const hoursOld = (now - callDate) / 3600000;
      if (hoursOld >= 48) {
        perCloser[closer].overdue++; teamOverdue++;
        overdueList.push({ ...c, hoursOld: Math.round(hoursOld) });
      }
    }
  }

  overdueList.sort((a, b) => b.hoursOld - a.hoursOld);

  const fmtCloser = sp => {
    if (!sp || sp === '(unassigned)') return '(unassigned)';
    return sp.charAt(0).toUpperCase() + sp.slice(1);
  };
  const fmtHours = h => {
    if (h < 24) return h + 'h';
    const days = Math.floor(h / 24);
    const rem = h % 24;
    return rem ? `${days}d ${rem}h` : `${days}d`;
  };
  const fmtDateTime = isoStr => {
    const d = new Date(isoStr);
    return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  };

  // Apply dismissed-overdue filter to team + per-closer counts (so KPIs match visible list)
  const __dismissed = (() => {
    try { return new Set(JSON.parse(localStorage.getItem('compliance.dismissed.v1') || '[]')); }
    catch { return new Set(); }
  })();
  const __callKey = c => `${c.e}|${c.dc}`;
  for (const c of overdueList) {
    if (__dismissed.has(__callKey(c))) {
      teamOverdue--;
      const closer = c.sp || '(unassigned)';
      if (perCloser[closer]) perCloser[closer].overdue = Math.max(0, perCloser[closer].overdue - 1);
    }
  }

  const teamCompliance = teamCalls > 0 ? (teamForms / teamCalls * 100).toFixed(1) + '%' : '—';

  // Window selector — dropdown for "Last 90d" + each month with data, most recent first
  const monthOptions = monthsWithData.map(ym => {
    const [y, m] = ym.split('-').map(Number);
    const label = new Date(y, m - 1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
    const selected = complianceWindow === ym ? ' selected' : '';
    return `<option value="${ym}"${selected}>${label}</option>`;
  }).join('');

  const last90Selected = complianceWindow === 'last90' ? ' selected' : '';
  const windowSelector = `
    <div class="controls" style="margin-bottom:20px">
      <label class="control-group">
        <span>Window</span>
        <select onchange="complianceWindow=this.value; overdueFilter='all'; renderCompliance();">
          <option value="last90"${last90Selected}>Last 90 Days (rolling)</option>
          <optgroup label="Spot-check by month">${monthOptions}</optgroup>
        </select>
      </label>
    </div>
  `;

  const teamHtml = `
    ${windowSelector}
    <div class="grid">
      <div class="kpi-card">
        <div class="kpi-label">Calls (${windowLabel})</div>
        <div class="kpi-value">${teamCalls}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Forms Submitted</div>
        <div class="kpi-value accent">${teamForms}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Team Compliance</div>
        <div class="kpi-value accent">${teamCompliance}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Overdue (>48hr, no form)</div>
        <div class="kpi-value" style="color:${teamOverdue > 0 ? 'var(--danger)' : 'var(--text)'}">${teamOverdue}</div>
      </div>
    </div>
  `;

  // Per-closer table
  const closerRows = Object.entries(perCloser)
    .filter(([_, d]) => d.calls > 0)
    .sort((a, b) => b[1].calls - a[1].calls)
    .map(([closer, d]) => {
      const pct = d.calls > 0 ? (d.forms / d.calls * 100) : null;
      const pctStr = pct === null ? '—' : pct.toFixed(1) + '%';
      const pctColor = pct === null ? '' : (pct >= 95 ? 'var(--accent)' : pct >= 85 ? 'var(--gold)' : 'var(--danger)');
      return `
        <tr>
          <td class="rep-name">${fmtCloser(closer)}</td>
          <td>${d.calls}</td>
          <td>${d.forms}</td>
          <td style="font-weight:700;color:${pctColor}">${pctStr}</td>
          <td style="color:${d.overdue > 0 ? 'var(--danger)' : 'var(--text-dim)'}">${d.overdue}</td>
        </tr>
      `;
    }).join('');

  const tableHtml = `
    <div class="section-title">Per Closer · ${windowLabel.charAt(0).toUpperCase() + windowLabel.slice(1)}</div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Closer</th>
        <th>Calls</th>
        <th>Forms Submitted</th>
        <th>Compliance %</th>
        <th>Overdue (>48hr)</th>
      </tr></thead>
      <tbody>${closerRows || '<tr><td colspan="5" style="text-align:center;color:var(--text-dim)">No data in this window</td></tr>'}</tbody>
    </table></div>
  `;

  // Load dismissed (manually marked complete) keys from localStorage.
  // A "complete" mark is local-only — used when Mason has verified the form was filled
  // in GHL but the sheet snapshot doesn't reflect it yet, OR when he's followed up with
  // the closer offline and resolved it.
  const DISMISS_KEY = 'compliance.dismissed.v1';
  const loadDismissed = () => {
    try { return new Set(JSON.parse(localStorage.getItem(DISMISS_KEY) || '[]')); }
    catch { return new Set(); }
  };
  const saveDismissed = set => {
    try { localStorage.setItem(DISMISS_KEY, JSON.stringify([...set])); } catch {}
  };
  const dismissed = loadDismissed();
  const callKey = c => `${c.e}|${c.dc}`;

  // Filter out dismissed entries from the overdue list before any other logic
  const visibleOverdue = overdueList.filter(c => !dismissed.has(callKey(c)));

  // Rep filter — operates on the already-dismissed-filtered list
  const overdueReps = [...new Set(visibleOverdue.map(c => c.sp || '(unassigned)'))].sort();
  if (overdueFilter !== 'all' && !overdueReps.includes(overdueFilter)) {
    overdueFilter = 'all';
  }
  const filteredOverdue = overdueFilter === 'all'
    ? visibleOverdue
    : visibleOverdue.filter(c => (c.sp || '(unassigned)') === overdueFilter);

  // Expose handlers globally so onclick can reach them
  window.__markComplete = (key) => {
    const s = loadDismissed();
    s.add(key);
    saveDismissed(s);
    renderCompliance();
  };
  window.__resetDismissed = () => {
    if (!confirm('Show all previously-dismissed overdue forms again?')) return;
    localStorage.removeItem(DISMISS_KEY);
    renderCompliance();
  };

  const filterBtn = (label, key, count) => `
    <button class="preset-btn ${overdueFilter === key ? 'active' : ''}"
            onclick="overdueFilter='${key}'; renderCompliance();">
      ${label} <span style="opacity:0.7">(${count})</span>
    </button>`;

  const filterBtns = [
    filterBtn('All', 'all', visibleOverdue.length),
    ...overdueReps.map(rep =>
      filterBtn(fmtCloser(rep), rep, visibleOverdue.filter(c => (c.sp || '(unassigned)') === rep).length)
    )
  ].join('');

  const overdueRows = filteredOverdue.slice(0, 200).map(c => {
    const key = callKey(c).replace(/'/g, "\\'");
    return `
    <tr>
      <td>${fmtDateTime(c.dc)}</td>
      <td class="rep-name">${fmtCloser(c.sp)}</td>
      <td style="font-weight:600">${c.n || '(no name)'}</td>
      <td style="font-family:monospace;font-size:13px;color:var(--text-dim)">${c.e || ''}</td>
      <td style="color:var(--text-dim);font-size:13px">${c.c || ''}</td>
      <td style="color:var(--danger);font-weight:700">${fmtHours(c.hoursOld)}</td>
      <td><button class="preset-btn" style="padding:6px 12px;font-size:12px"
                  onclick="__markComplete('${key}')"
                  title="Mark this overdue form as complete (local-only — won't change GHL or the sheet)">
        ✓ Complete
      </button></td>
    </tr>`;
  }).join('');

  const overdueLabel = overdueFilter === 'all'
    ? `Overdue Forms (${visibleOverdue.length})`
    : `Overdue Forms — ${fmtCloser(overdueFilter)} (${filteredOverdue.length})`;

  const dismissedCount = dismissed.size;
  const dismissedNote = dismissedCount > 0
    ? `<span style="color:var(--text-dim);font-size:12px;font-weight:500;margin-left:12px">
         ${dismissedCount} dismissed
         <a href="#" onclick="event.preventDefault();__resetDismissed()" style="color:var(--accent);margin-left:6px">reset</a>
       </span>`
    : '';

  const overdueHtml = `
    <div class="section-title" style="margin-top:32px">${overdueLabel}${dismissedNote}</div>
    ${visibleOverdue.length === 0
      ? '<div class="status" style="color:var(--accent)">✓ No overdue forms — all past calls in this window have a post-call form filled (or have been marked complete).</div>'
      : `<div class="controls" style="margin-bottom:12px">${filterBtns}</div>
         <div class="table-wrap"><table>
          <thead><tr>
            <th>Call Time</th>
            <th>Closer</th>
            <th>Client</th>
            <th>Email</th>
            <th>Calendar</th>
            <th>Overdue By</th>
            <th></th>
          </tr></thead>
          <tbody>${overdueRows || '<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:24px">No overdue forms for this closer.</td></tr>'}</tbody>
        </table></div>`
    }
  `;

  // Footnote
  const lastDate = CALL_TRACKING.length ? CALL_TRACKING[CALL_TRACKING.length - 1].dc.slice(0, 10) : '';
  const footHtml = `
    <div class="footnote">
      <strong>Source:</strong> Sales Call Tracking 2025 sheet — Call Tracking tab. Each row = one call.<br>
      <strong>Window:</strong> ${windowLabel} · past-dated calls only · default rolling ${COMPLIANCE_WINDOW_DAYS}d (use buttons above to spot-check by month).
      <strong>Form filled =</strong> any of {Lead Interest, Lead Quality, Notes, Deal Closed, Monthly Revenue, B2 Model} populated (matches GHL "Form submitted" event).
      <strong>Overdue =</strong> form not filled AND call held more than 48 hours ago.<br>
      Snapshot through ${lastDate} · Auto-refreshes daily at 7 AM.
    </div>
  `;

  root.innerHTML = teamHtml + tableHtml + overdueHtml + footHtml;
}

const init = getMTDRange();
document.getElementById('startDate').value = fmtDate(init.start);
document.getElementById('endDate').value = fmtDate(init.end);

loadData();
</script>
</body>
